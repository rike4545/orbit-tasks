name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: |
          set -euxo pipefail
          xcodebuild             -resolvePackageDependencies             -project "Orbit Tasks.xcodeproj"             -scheme "Orbit Tasks"

      - name: Build for iOS Simulator
        run: |
          set -euxo pipefail
          xcodebuild             -project "Orbit Tasks.xcodeproj"             -scheme "Orbit Tasks"             -configuration Debug             -sdk iphonesimulator             -destination "generic/platform=iOS Simulator"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(python3 - <<'PY'
          import json
          import subprocess
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True
          ))
          for runtime in sorted(data.get("devices", {}).keys(), reverse=True):
              for device in data["devices"][runtime]:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Run unit tests
        run: |
          set -euxo pipefail
          xcodebuild             -project "Orbit Tasks.xcodeproj"             -scheme "Orbit Tasks"             -configuration Debug             -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             -only-testing:"Orbit TasksTests"             test
