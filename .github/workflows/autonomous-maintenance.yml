name: Autonomous Maintenance

on:
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-maintenance
  cancel-in-progress: false

jobs:
  format-validate-and-merge:
    runs-on: xcode-27
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer

      - name: Configure Git
        run: |
          git config user.name "orbit-tasks-maintenance[bot]"
          git config user.email "orbit-tasks-maintenance[bot]@users.noreply.github.com"

      - name: Auto-format tracked Swift source
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun --find swift-format >/dev/null 2>&1; then
            echo "swift-format is unavailable; skipping formatting."
            exit 0
          fi

          git ls-files -z '*.swift'             | xargs -0 xcrun swift-format --parallel --in-place

      - name: Resolve Swift packages
        run: |
          set -euxo pipefail
          xcodebuild             -resolvePackageDependencies             -project "Orbit Tasks.xcodeproj"             -scheme "Orbit Tasks"

      - name: Validate build
        run: |
          set -euxo pipefail
          xcodebuild             -project "Orbit Tasks.xcodeproj"             -scheme "Orbit Tasks"             -configuration Debug             -sdk iphonesimulator             -destination "generic/platform=iOS Simulator"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(python3 - <<'PY'
          import json
          import subprocess
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True
          ))
          for runtime in sorted(data.get("devices", {}).keys(), reverse=True):
              for device in data["devices"][runtime]:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Validate unit tests
        run: |
          set -euxo pipefail
          xcodebuild             -project "Orbit Tasks.xcodeproj"             -scheme "Orbit Tasks"             -configuration Debug             -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             -only-testing:"Orbit TasksTests"             test

      - name: Create and merge formatting improvement
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Repository is already consistently formatted."
            exit 0
          fi

          branch="automation/swift-format-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add -- '*.swift'
          git commit -m "style: apply automated Swift formatting"
          git push origin "$branch"

          pr_url="$(
            gh pr create               --repo "$REPO"               --base main               --head "$branch"               --title "style: automated Swift formatting"               --body "Automated weekly maintenance. The workflow formatted tracked Swift files, rebuilt the app, and ran the unit tests before opening this PR."
          )"

          gh pr merge "$pr_url"             --repo "$REPO"             --squash             --delete-branch
